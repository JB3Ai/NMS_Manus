name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
      target:
        description: 'Vercel target (production/preview)'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Deploy checked-out files to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "VERCEL_TOKEN and VERCEL_PROJECT_ID must be set as repository secrets."
            exit 1
          fi

          project_info=$(curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          scope=$(echo "$project_info" | jq -r '.account.id // empty')
          if [ -z "$scope" ]; then
            echo "Could not resolve the Vercel project scope."
            exit 1
          fi

          npx --yes vercel@41.7.0 link \
            --yes \
            --project "$VERCEL_PROJECT_ID" \
            --scope "$scope" \
            --token "$VERCEL_TOKEN"

          deploy_args=(--yes --token "$VERCEL_TOKEN")
          if [ "$TARGET" = "production" ]; then
            deploy_args+=(--prod)
          fi

          url=$(npx --yes vercel@41.7.0 deploy "${deploy_args[@]}")
          echo "Deployment created: $url"
