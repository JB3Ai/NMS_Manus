name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
      target:
        description: 'Vercel target (production/preview)'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Deploy checked-out files to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "VERCEL_TOKEN and VERCEL_PROJECT_ID must be set as repository secrets."
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "VERCEL_ORG_ID must be set as a repository secret."
            exit 1
          fi

          rm -rf .vercel

          npx --yes vercel@41.7.0 link \
            --yes \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN"

          deploy_args=(--yes --token "$VERCEL_TOKEN")
          if [ "$TARGET" = "production" ]; then
            deploy_args+=(--prod)
          fi

          url=$(npx --yes vercel@41.7.0 deploy "${deploy_args[@]}")
          echo "Deployment created: $url"
